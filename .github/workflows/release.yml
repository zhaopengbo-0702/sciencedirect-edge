name: Publish extension ZIP

'on':
  push:
    branches: [main]
    paths: [manifest.json, '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-extension-zip

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Package and publish the manifest version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content -LiteralPath manifest.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+(\.\d+){0,3}$') { throw 'Invalid extension manifest version.' }

          $tag = 'latest'
          $tagRef = "refs/tags/$tag"
          $assetName = "ScienceDirect-Edge-v$version.zip"
          $title = "ScienceDirect-Edge v$version"
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the checked-out commit.' }

          $releaseJson = gh release view $tag --json assets,name,body 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $release = if ($releaseExists) { $releaseJson | ConvertFrom-Json }
          $assets = @($release.assets.name | Where-Object { $_ })
          $previousArchives = @($assets | Where-Object { $_ -match '^ScienceDirect-Edge-v\d+(\.\d+){0,3}\.zip$' -and $_ -ne $assetName })

          $remoteTags = git ls-remote --tags origin $tagRef "$tagRef^{}"
          if ($LASTEXITCODE -ne 0) { throw "Could not check Git tag $tag." }
          $previousTagObject = ($remoteTags | Select-Object -First 1) -split '\s+' | Select-Object -First 1
          $previousCommit = ($remoteTags | Select-Object -Last 1) -split '\s+' | Select-Object -First 1
          if ($releaseExists -and $release.name -eq $title -and $assets -contains $assetName -and $previousArchives.Count -eq 0) {
            Write-Host "$assetName is already the current release asset."
            exit 0
          }

          if ($assets -notcontains $assetName) {
            $packageDirectory = Join-Path $env:RUNNER_TEMP ('sciencedirect-' + [guid]::NewGuid().ToString('N'))
            $bundle = Join-Path $packageDirectory 'ScienceDirect-Edge'
            $desktopHost = Join-Path $bundle 'desktop-host'
            New-Item -ItemType Directory -Path $desktopHost -Force | Out-Null
            $packageFiles = @(
              'manifest.json', 'background.js', 'page.js', 'offscreen.html', 'offscreen.js',
              'popup.html', 'popup.css', 'popup.js', 'icons',
              'faker-core.js', 'faker-content.js', 'faker-background.js', 'panel.js', 'NOTICE',
              'register-desktop-host.ps1', 'register-desktop-host.cmd', 'README.md', 'CHANGELOG.md'
            )
            Copy-Item -LiteralPath $packageFiles -Destination $bundle -Recurse
            Copy-Item -LiteralPath 'desktop-host/ScienceDirectDesktopHost.cs', 'desktop-host/ScienceDirectDesktopHost.exe' -Destination $desktopHost
            $archive = Join-Path $env:RUNNER_TEMP $assetName
            Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $archive -Force
          }

          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $headingVersion = [regex]::Escape($version)
          $entry = [regex]::Match($changelog, "(?ms)^##[ \t]+(?:\[v?$headingVersion\]|v?$headingVersion)(?=[ \t\r\n]|$)[^\r\n]*\r?\n(?<body>.*?)(?=^##[ \t]|\z)")
          if (-not $entry.Success -or -not $entry.Groups['body'].Value.Trim()) { throw "CHANGELOG.md needs a section for v$version." }
          Set-Content -LiteralPath $notes -Value $entry.Value.Trim() -Encoding utf8

          if ($releaseExists -and $assets -notcontains $assetName) {
            gh release upload $tag $archive
            if ($LASTEXITCODE -ne 0) { throw "Could not upload $assetName." }
          }
          if ($releaseExists) {
            gh release edit $tag --title $title --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not edit release $tag." }
          }
          if ($previousCommit -ne $commit) {
            git push "--force-with-lease=${tagRef}:$previousTagObject" origin "${commit}:$tagRef"
            if ($LASTEXITCODE -ne 0) { throw "Could not update Git tag $tag." }
          }
          if (-not $releaseExists) {
            gh release create $tag $archive --verify-tag --title $title --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Could not publish $assetName." }
          }
          # Keep the repository README in sync with the released version.
          $readme = Get-Content -LiteralPath README.md -Raw
          $downloadLine = "**当前版本：v$version** ｜ [⬇ 下载最新版本](https://github.com/$env:GITHUB_REPOSITORY/releases/latest) ｜ 历史更新记录见 [CHANGELOG.md](CHANGELOG.md)"
          $updated = $readme -replace '(?m)^# .*$', "# ScienceDirect 论文下载助手 v$version"
          $updated = $updated -replace '(?m)^\*\*当前版本[:：]?.*$', $downloadLine
          if ($updated -ne $readme) {
            Set-Content -LiteralPath README.md -Value $updated -Encoding utf8 -NoNewline
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m "docs: show current version v$version"
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Could not update README version.' }
          }
          foreach ($oldArchive in $previousArchives) {
            gh release delete-asset $tag $oldArchive --yes
            if ($LASTEXITCODE -ne 0) { throw "Could not remove the previous asset $oldArchive." }
          }
